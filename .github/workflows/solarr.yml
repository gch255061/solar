name: Solar System Workflowww

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}} 
jobs:
    unit-testing:
        name: Unit Testing


        strategy:
          matrix:
            os: [ubuntu-latest]
            node_version: [24]
            exclude:
            - os: macos-latest
              node_version: 20
        runs-on: ${{matrix.os}}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version
          uses: actions/setup-node@v6
          with:
            node-version: ${{matrix.node_version}}

        - name: Cache NPM modules
          uses: actions/cache@v4
          with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
    
        - name: Install Dependencies
          run: npm install

    
        - name: Unit Testing
          id: node-test-case
          run: npm test
          
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-${{ matrix.node_version }}-${{matrix.os}}
            path: test-results.xml
            overwrite: true
            

    coverage-testing:
        name: Coverage Testing

        strategy:
          matrix:
            os: [ubuntu-latest]
            node_version: [24]
            exclude:
            - os: macos-latest
              node_version: 20
        runs-on: ${{matrix.os}}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version
          uses: actions/setup-node@v6
          with:
            node-version: ${{matrix.node_version}}

        - name: Cache NPM modules
          uses: actions/cache@v4
          with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

    
        - name: Install Dependencies
          run: npm install
    
        - name: Coverage Testing
          continue-on-error: true
          run: npm run coverage
          
        - name: Archive coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result-${{ matrix.node_version }}-${{matrix.os}}
            path: coverage
            retention-days: 5
            overwrite: true

    docker-login:
      name: Containeriation
      needs: [unit-testing,coverage-testing]
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}
          

      - name: Docker image testing
        run: |
          docker images
          docker run --name solar-system-app  -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP
          echo Testing image url using wget
          wget -q -O - http://127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

